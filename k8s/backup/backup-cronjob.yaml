apiVersion: batch/v1
kind: CronJob
metadata:
  name: sec-backup-daily
  namespace: sec
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: backup-sa
          containers:
          - name: backup
            image: ubuntu:22.04
            env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-creds
                  key: password
            command:
            - /bin/bash
            - -c
            - |
              set -e
              apt-get update && apt-get install -y postgresql-client-15
              pg_dump -h postgres.sec.svc.cluster.local -U postgres -d sec > /backup/sec-backup.dump
              echo "Backup done"
            volumeMounts:
            - name: backup-volume
              mountPath: /backup
          volumes:
          - name: backup-volume
            persistentVolumeClaim:
              claimName: backup-pvc
          restartPolicy: OnFailure
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-sa
  namespace: sec
