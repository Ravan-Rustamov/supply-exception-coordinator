version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16-latest
    container_name: sec-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sec
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./shared/db_init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sec-network

  redis:
    image: redis:7-alpine
    container_name: sec-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sec-network

  mock-erp:
    build:
      context: services/mock_erp
      dockerfile: Dockerfile
    container_name: sec-erp
    environment:
      PYTHONUNBUFFERED: 1
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sec-network
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

  mock-inbox:
    build:
      context: services/mock_inbox
      dockerfile: Dockerfile
    container_name: sec-inbox
    environment:
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: 1
    ports:
      - "8002:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sec-network
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

  case-api:
    build:
      context: services/case_api
      dockerfile: Dockerfile
    container_name: sec-api
    environment:
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: 1
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sec-network
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: services/worker
      dockerfile: Dockerfile
    container_name: sec-worker
    environment:
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PYTHONUNBUFFERED: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sec-network
    command: python main.py

volumes:
  postgres_data:
  redis_data:

networks:
  sec-network:
    driver: bridge
